<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Simon Says Game</h1>
    <h2>Press any key to start the game</h2>


    <div class="btn-container">

        <div class="line_one">
            <div type="button" class="red btn"  id="red">1</div>
            <div type="button"class="yellow btn"  id="yellow">2</div>
        </div>

        <div class="line_two">
            <div type="button"class="green btn"   id="green">3</div>
            <div type="button"class="purple btn" id="purple">4</div>
        </div>

    </div>
<h2 id="Highest">Your Highest Score : 0</h2>

    <script src="app.js"></script>
</body>

</html>
